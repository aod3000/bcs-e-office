<!DOCTYPE html>
<html lang="th" data-theme="school">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | โรงเรียนบางชันปลื้มวิทยานุสรณ์</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen font-sans leading-relaxed">

  <div class="min-h-screen flex items-center justify-center px-4 py-10 sm:px-6">
    <div class="w-full max-w-5xl overflow-hidden rounded-3xl bg-white shadow-xl grid lg:grid-cols-2">

      <!-- ฝั่งซ้าย: แบรนด์โรงเรียน (แสดงเฉพาะจอใหญ่) -->
      <section class="relative hidden lg:flex flex-col justify-between overflow-hidden bg-gradient-to-br from-green-600 to-green-900 p-12 text-white">
        <span class="float-slow absolute -top-10 -right-10 h-48 w-48 rounded-full bg-white/10"></span>
        <span class="float-medium absolute bottom-24 right-16 h-16 w-16 rounded-full bg-yellow-400/30"></span>
        <a href="index.html" class="relative flex items-center">
          <img src="assets/logo.png" alt="โลโก้โรงเรียนบางชัน" class="h-14 w-auto object-contain mr-3">
          <span class="font-medium">บางชันปลื้มวิทยานุสรณ์</span>
        </a>
        <div class="relative">
          <p class="text-sm font-medium text-yellow-400">ระบบสำนักงานอิเล็กทรอนิกส์ (E-Office)</p>
          <h1 class="mt-3 text-4xl font-semibold leading-tight">ส่งงาน ลา อนุมัติ<br>ครบในที่เดียว</h1>
          <p class="mt-4 max-w-sm font-light text-green-100">ลดกระดาษ เพิ่มเวลาให้นักเรียน เข้าสู่ระบบด้วยบัญชี @bcs.ac.th ของโรงเรียน</p>
        </div>
      </section>

      <!-- ฝั่งขวา: ฟอร์ม Login -->
      <section class="p-6 sm:p-12 flex flex-col justify-center">
        <a href="index.html" class="lg:hidden mb-6 flex items-center">
          <img src="assets/logo.png" alt="โลโก้โรงเรียนบางชัน" class="h-12 w-auto object-contain mr-3">
          <span class="font-medium text-slate-900">บางชันปลื้มวิทยานุสรณ์</span>
        </a>

        <h2 class="text-3xl font-semibold text-slate-900">เข้าสู่ระบบ</h2>
        <p class="mt-2 text-slate-500">ยินดีต้อนรับกลับมา กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>

        <!-- ข้อความแจ้งเตือน -->
        <div id="login-error" role="alert" class="hidden mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

        <!-- Google SSO -->
        <button id="google-btn" type="button"
          class="mt-8 flex w-full items-center justify-center gap-3 rounded-full border border-slate-200 bg-white px-6 py-3.5 text-sm font-medium text-slate-700 shadow-sm hover:border-yellow-300 hover:shadow-lg hover:-translate-y-0.5 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:translate-y-0 transition-all duration-300">
          <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
            <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          เข้าสู่ระบบด้วย Google (@bcs.ac.th)
        </button>

        <div class="my-6 flex items-center gap-4 text-xs text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span>หรือใช้อีเมลและรหัสผ่าน<span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <!-- ฟอร์ม Email/Password -->
        <form id="login-form" class="space-y-5" novalidate>
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">อีเมล</label>
            <input id="email" name="email" type="email" autocomplete="username" required placeholder="ชื่อ@bcs.ac.th"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-green-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-yellow-200 transition-all duration-300">
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">รหัสผ่าน</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 pr-20 text-sm focus:border-green-600 focus:bg-white focus:outline-none focus:ring-4 focus:ring-yellow-200 transition-all duration-300">
              <button id="toggle-password" type="button" class="absolute inset-y-0 right-3 my-auto h-8 rounded-full px-3 text-xs font-medium text-green-700 hover:bg-yellow-100 transition">แสดง</button>
            </div>
          </div>

          <button id="login-btn" type="submit"
            class="flex w-full items-center justify-center gap-3 rounded-full bg-yellow-400 px-6 py-3.5 font-medium text-green-900 shadow-sm hover:bg-yellow-300 hover:shadow-lg hover:-translate-y-0.5 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:translate-y-0 transition-all duration-300">
            <svg id="login-spinner" class="hidden h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span id="login-text">เข้าสู่ระบบ</span>
          </button>
        </form>

        <a href="index.html" class="mt-8 text-center text-sm text-slate-500 hover:text-green-700 transition">← กลับหน้าแรก</a>
      </section>
    </div>
  </div>

  <!-- Supabase JS (CDN) ต้องโหลดก่อน supabase-client.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
